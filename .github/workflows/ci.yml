name: CI

on:
  push:
    branches: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install GTK and test dependencies
        run: |
          sudo apt-get update
          # python3-gi is installed for Ubuntu's system Python.  Creating the
          # venv with that interpreter keeps its dist-packages (and GTK
          # introspection bindings) available to the GTK-backed tests.
          sudo apt-get install -y gir1.2-gtk-4.0 python3-gi python3-venv
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install '.[dev]'
      - name: Run checks
        run: make PYTHON=.venv/bin/python check
      - name: Compile source
        run: .venv/bin/python -m compileall -q src
